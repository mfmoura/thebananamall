services:
  ngrok:
    mem_limit: ${DOCKER_NGROK_MEMORY:-128m}
    image: ngrok/ngrok:latest
    profiles: ["webhooks"]
    command: ["http", "http://nginx:80", "--url=https://roxann-nonrationalistical-actinically.ngrok-free.dev", "--config=/etc/ngrok.yml"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - ./.docker/ngrok/ngrok.yml:/etc/ngrok.yml:ro
    networks:
      - dockernet
    depends_on:
      - nginx

  nginx:
    mem_limit: ${DOCKER_NGINX_MEMORY:-128m}
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./.docker/nginx/fastcgi-php.conf:/etc/nginx/snippets/fastcgi-php.conf
    networks:
      - dockernet
    depends_on:
      - php
      - db

  php:
    mem_limit: ${DOCKER_PHP_MEMORY:-1536m}
    image: lojavirtuallcb-php
    user: "1000:1000"
    build:
      context: .
      dockerfile: ./.docker/Dockerfile
    volumes:
      - ./:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini
      - ./.docker/php/www-memory.conf:/usr/local/etc/php-fpm.d/zz-memory.conf:ro
    expose:
      - "9000"
    networks:
      - dockernet
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  horizon:
    mem_limit: ${DOCKER_HORIZON_MEMORY:-1536m}
    image: lojavirtuallcb-php
    init: true
    user: "1000:1000"
    restart: unless-stopped
    entrypoint: ["php", "artisan"]
    command: ["horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 240s
    environment:
      QUEUE_CONNECTION: redis
    volumes:
      - ./:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini
    networks:
      - dockernet
    depends_on:
      php:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    mem_limit: ${DOCKER_SCHEDULER_MEMORY:-512m}
    image: lojavirtuallcb-php
    init: true
    user: "1000:1000"
    restart: unless-stopped
    entrypoint: ["php", "artisan"]
    command: ["schedule:work"]
    stop_signal: SIGTERM
    volumes:
      - ./:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini
    networks:
      - dockernet
    depends_on:
      horizon:
        condition: service_started

  db:
    mem_limit: ${DOCKER_DB_MEMORY:-1024m}
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: default
      POSTGRES_PASSWORD: default
      POSTGRES_DB: default
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dockernet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U default -d default"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    mem_limit: ${DOCKER_REDIS_MEMORY:-768m}
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "noeviction"]
    restart: always
    networks:
      - dockernet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  node:
    mem_limit: ${DOCKER_NODE_MEMORY:-1536m}
    image: node:20-bullseye
    user: "1000:1000"
    working_dir: /var/www/html
    environment:
      NODE_OPTIONS: --max-old-space-size=${NODE_HEAP_MB:-1024}
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    networks:
      - dockernet

networks:
  dockernet:

volumes:
  db-data:
