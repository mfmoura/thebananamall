map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream vite_node {
    zone vite_node 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server node:5173 resolve;
}

upstream laravel_php {
    zone laravel_php 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server php:9000 resolve;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    client_max_body_size 6m;
    index index.php index.html;

    # Assets e WebSocket de desenvolvimento passam pela mesma entrada HTTP.
    location ^~ /vite/ {
        proxy_pass http://vite_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Rota principal (Laravel)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_pass laravel_php;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        include fastcgi_params;
    }

    # Bloquear arquivos .ht*
    location ~ /\.ht {
        deny all;
    }
}
