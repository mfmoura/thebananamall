error_reporting = E_ALL
log_errors = On
display_errors = On
display_startup_errors = On
html_errors = On

; Configuração de memória e tempo de execução
memory_limit = 256M
max_execution_time = 300
post_max_size = 20M
upload_max_filesize = 20M

; Configurações adicionais
session.save_path = "/tmp"
short_open_tag = Off

; Cobertura somente quando solicitada: php -d pcov.enabled=1 artisan test --coverage
pcov.enabled = 0
pcov.directory = /var/www/html/app

; Cache de código e resolução de caminhos no volume do projeto.
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
realpath_cache_size = 4096K
realpath_cache_ttl = 120
